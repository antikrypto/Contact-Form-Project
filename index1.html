<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="white-box">
      <div class="us">
        <h1>Contact Us</h1>
      </div>

      <div class="person">
        <div class="first">
          <label for="">First Name <span>*</span></label>
          <input type="text" />
        </div>

        <div class="first">
          <label for="">Last Name <span>*</span></label>
          <input type="text" />
        </div>
      </div>

      <div class="email">
        <label for="">Email Address <span>*</span></label>
        <input type="text" />
      </div>

      <div class="query">
        <div class="type">
          <label for="">Query Type <span>*</span></label>
          <button>
            <input type="radio" />
            General Enquiry
          </button>
        </div>

        <div class="support">
          <button>
            <input type="radio" />
            Support Request
          </button>
        </div>
      </div>

      <div class="message">
        <label for="">Message <span>*</span></label>
        <textarea name="" id=""></textarea>
      </div>

      <div class="consent">
        <input type="checkbox" />
        <p>I Consent To Being Contacted By The Team</p>
      </div>

      <div class="submit">
        <button>
            Submit
        </button>
      </div>
    </div>
  </body>
</html>
